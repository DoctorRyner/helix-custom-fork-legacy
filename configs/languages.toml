[language-server.wakatime]
command = "wakatime-ls"

[language-server.gpt]
command = "bun"
args = ["run", "/usr/local/bin/helix-gpt", "--handler", "copilot", "--triggerCharacters", ""]

# [language-server.gpt]
# command = "helix-assist"
# (Options)
# args = ["--handler", "xai", "--num-suggestions", "2"]
# args = ["--handler", "anthropic", "--num-suggestions", "2"]

[language-server.uwu_colors]
command = "uwu_colors"

# [language-server.typescript-language-server]
[language-server.tsgo]
command = "tsgo"
args = ["--lsp", "--stdio"]

[language-server.typescript-language-server.config.typescript]
updateImportsOnFileMove.enabled = "always"
suggest.completeFunctionCalls = true
tsserver.enableTracing = true
inlayHints.parameterNames.enabled = "all"
inlayHints.parameterTypes.enabled = true
inlayHints.variableTypes.enabled = true
inlayHints.propertyDeclarationTypes.enabled = true
inlayHints.functionLikeReturnTypes = true
inlayHints.enumMemberValues.enabled = true
format.enable = false
format.semicolons = "remove"
preferences.importModuleSpecifier = "non-relative"
preferences.importModuleSpecifierEnding = "auto"
tsserver.pluginPaths = ["typescript-plugin-css-modules", "./node_modules"]
tsserver.experimental.enableProjectDiagnostics = true

[language-server.emmet-ls]
command = "emmet-ls"
args = ["--stdio"]

[language-server.efm]
command = "efm-langserver"

[language-server.eslint]
command = "vscode-eslint-language-server"
args = ["--stdio"]

[language-server.biome]
command = "biome"
args = ["lsp-proxy", "--config-path", "biome.json"]

[language-server.vscode-json-language-server.config]
json = { validate = { enable = true }, format = { enable = true } }
provideFormatter = true

[language-server.vscode-css-language-server.config]
css = { validate = { enable = true } }
scss = { validate = { enable = true } }
less = { validate = { enable = true } }
provideFormatter = true

[language-server.eslint.config]
validate = "on"
experimental = { useFlatConfig = false }
rulesCustomizations = []
run = "onType"
problems = { shortenToSingleLine = false }
nodePath = ""

[language-server.eslint.config.codeAction]
[language-server.eslint.config.codeAction.disableRuleComment]
enable = true
location = "separateLine"

[language-server.eslint.config.codeAction.showDocumentation]
enable = true

[language-server.eslint.config.codeActionOnSave]
enable = true
mode = "fixAll"

[language-server.eslint.config.workingDirectory]
mode = "location"

[[language]]
name = "typescript"
formatter = { command = "prettier", args = ["--parser", "typescript"] }
file-types = ["ts"]
language-servers = [
  # { name = "tsgo", except-features = ["format"] },
  { name = "tsgo", except-features = ["format", "completion", "code-action"] },
  { name = "typescript-language-server", only-features = ["completion", "code-action"] },
  { name = "eslint", except-features = ["format"] },
  { name = "emmet-ls" },
  { name = "uwu_colors" },
  { name = "gpt" },
  { name = "wakatime" }
]

[[language]]
name = "tsx"
formatter = { command = "prettier", args = ["--stdin-filepath", "file.tsx"] }
block-comment-tokens = [{start = "{/*", end = "*/}"}]
file-types = ["tsx"]
language-servers = [
  # { name = "tsgo", except-features = ["format"] },
  { name = "tsgo", except-features = ["format", "completion", "code-action"] },
  { name = "typescript-language-server", only-features = ["completion", "code-action"] },
  { name = "eslint", except-features = ["format"] },
  { name = "emmet-ls" },
  { name = "uwu_colors" },
  { name = "gpt" },
  { name = "wakatime" }
]

[[language]]
name = "haskell"
